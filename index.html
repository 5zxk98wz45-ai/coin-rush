<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coin Rush">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Coin Rush</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111827;font-family:system-ui,-apple-system,sans-serif}
body{display:flex;align-items:center;justify-content:center}
#wrap{width:min(100vw,520px);height:100dvh;display:flex;flex-direction:column;align-items:center;padding:12px;gap:8px}
h1{margin:0;color:white;font-size:28px}
#hud{width:100%;display:flex;justify-content:space-between;color:white;font-weight:800;font-size:18px}
canvas{width:100%;flex:1;min-height:0;background:linear-gradient(#72c9ff,#d9f4ff);border-radius:20px;touch-action:none}
#controls{width:100%;display:flex;justify-content:center;gap:18px;padding-bottom:env(safe-area-inset-bottom)}
button{border:0;border-radius:18px;background:#fff;padding:15px 25px;font-size:22px;font-weight:800;box-shadow:0 4px 12px #0004;touch-action:manipulation}
#restart{display:none;background:#ffd84d}
</style>
</head>
<body>
<div id="wrap">
<h1>🪙 Coin Rush</h1>
<div id="hud"><span id="score">Score : 0</span><span id="lives">❤️❤️❤️</span></div>
<canvas id="game"></canvas>
<div id="controls">
<button id="left">⬅️</button><button id="right">➡️</button>
<button id="restart">🔄 Rejouer</button>
</div>
</div>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');
const scoreEl=document.getElementById('score'), livesEl=document.getElementById('lives'), restart=document.getElementById('restart');
let W,H,dpr,score=0,lives=3,over=false,keys={left:false,right:false};
let player={x:0,y:0,w:42,h:42,speed:7}, items=[],last=0,spawn=0,inv=0;

function resize(){
 dpr=Math.min(devicePixelRatio||1,2);
 W=c.clientWidth; H=c.clientHeight; c.width=W*dpr;c.height=H*dpr;
 ctx.setTransform(dpr,0,0,dpr,0,0);
 player.y=H-62; if(!player.x) player.x=W/2;
}
addEventListener('resize',resize); resize();

function vibrate(p=30){if(navigator.vibrate)navigator.vibrate(p)}
function spawnItem(){
 const coin=Math.random()<.72;
 items.push({x:18+Math.random()*(W-36),y:-25,r:coin?13:16,coin,vy:2.5+Math.random()*2.2});
}
function reset(){
 score=0;lives=3;over=false;items=[];spawn=0;inv=0;player.x=W/2;
 restart.style.display='none'; updateHud();
}
function updateHud(){
 scoreEl.textContent='Score : '+score;
 livesEl.textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives);
}
function hit(a,b){
 return Math.abs(a.x-b.x)<a.w/2+b.r && Math.abs(a.y-b.y)<a.h/2+b.r;
}
function end(){over=true;restart.style.display='block';vibrate([100,60,100])}

function loop(t){
 const dt=Math.min((t-last)/16.67||1,2); last=t;
 if(!over){
  if(keys.left)player.x-=player.speed*dt;
  if(keys.right)player.x+=player.speed*dt;
  player.x=Math.max(25,Math.min(W-25,player.x));
  spawn+=dt;
  if(spawn>28){spawn=0;spawnItem()}
  if(inv>0)inv-=dt;
  for(let i=items.length-1;i>=0;i--){
   const o=items[i];o.y+=o.vy*dt;
   if(hit(player,o)){
    items.splice(i,1);
    if(o.coin){score++;vibrate(18)}else if(inv<=0){lives--;inv=60;vibrate(80);if(lives<=0)end()}
    updateHud();continue;
   }
   if(o.y>H+30)items.splice(i,1);
  }
 }
 draw();requestAnimationFrame(loop);
}
function draw(){
 ctx.clearRect(0,0,W,H);
 ctx.fillStyle='#ffffff55';for(let i=0;i<7;i++){ctx.beginPath();ctx.arc((i*97+30)%W,70+(i%3)*75,18,0,7);ctx.fill()}
 items.forEach(o=>{
  ctx.font=(o.r*2)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(o.coin?'🪙':'💣',o.x,o.y);
 });
 ctx.globalAlpha=inv>0&&Math.floor(inv/6)%2?0.35:1;
 ctx.font='42px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🧑‍🚀',player.x,player.y);
 ctx.globalAlpha=1;
 if(over){
  ctx.fillStyle='#0009';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='white';ctx.font='bold 34px system-ui';ctx.fillText('GAME OVER',W/2,H/2-20);
  ctx.font='22px system-ui';ctx.fillText('Score : '+score,W/2,H/2+20);
 }
}
function bind(btn,dir){
 const on=e=>{e.preventDefault();keys[dir]=true};
 const off=e=>{e.preventDefault();keys[dir]=false};
 btn.addEventListener('pointerdown',on);btn.addEventListener('pointerup',off);
 btn.addEventListener('pointercancel',off);btn.addEventListener('pointerleave',off);
}
bind(document.getElementById('left'),'left');bind(document.getElementById('right'),'right');
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')keys.left=true;if(e.key==='ArrowRight')keys.right=true});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.left=false;if(e.key==='ArrowRight')keys.right=false});
restart.onclick=reset;
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));
updateHud();requestAnimationFrame(loop);
</script>
</body>
</html>
